; R-CATS — Rider Combat And Traversal System
; Seeded into the mod folder on first build; later builds never overwrite it.

[General]
; trace | debug | info | warn | error | critical | off
LogLevel = info

[Layers]
; 0 disables a layer entirely (useful for isolating problems).
; Layers that aren't implemented yet are listed as "not implemented" in the log.
Input        = 1
AnimReplacer = 1
Combo        = 1
HitDetect    = 1
Impact       = 1
Movement     = 1
Parkour      = 1
Skills       = 1
Transform    = 1

[Input]
; Keys: names (W, Space, LShift, Mouse1/LMB, Mouse2/RMB, WheelUp, PadA, PadRT, PadLB ...)
; or numbers (0x11, 17). Several keys per binding: comma-separated. "none" clears it.
Forward     = W
Back        = S
Left        = A
Right       = D
Attack      = Mouse1, PadRT
; Leave as none to make power attacks "hold Attack". Bind a key to use a dedicated button.
PowerAttack = none
; Held to block. Vanilla's own block still runs; R-CATS reads it for combat (guard, parry).
Block       = Mouse2, PadLT

; Attack held at least this long becomes a power attack.
PowerAttackHoldMs = 300
; A direction released this recently still counts for W/S/A/D + attack chords.
ChordWindowMs     = 120
; How long a recognised attack waits in the buffer for the combo system.
BufferWindowMs    = 250
; Left stick magnitude (0-1) below which direction is neutral.
StickDeadzone     = 0.35
; Gamepad trigger pull (0-1) that counts as a press; it releases below half of this.
TriggerThreshold  = 0.5

; 1 logs every button press/release (with device and raw id) and left-stick direction
; change to R-CATS.log. Use it to check what the game actually sends; leave 0 normally.
LogRawInput       = 0

; 1 reads input through a hook on the player's controls, which sees every press including
; the gamepad triggers. 0 falls back to listening on the menu input list, which misses the
; right trigger in gameplay. Only set 0 to isolate a problem.
HookPlayerControls = 1
